name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  ci:
    name: Build + Lint + Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Keep this version in sync with the toolchain used to format the
          # tree: `make fmt-check` compares against this Go's gofmt, and gofmt
          # output can differ between Go releases.
          go-version: 1.27

      - name: Build
        run: make build

      - name: Check formatting
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Test with race detector
        run: make test-race
