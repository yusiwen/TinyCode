name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  ci:
    name: Build + Lint + Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Keep this version in sync with the toolchain used to format the
          # tree: `make fmt-check` compares against this Go's gofmt, and gofmt
          # output can differ between Go releases.
          go-version: 1.27

      - name: Build
        run: make build

      - name: Check formatting
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Test with race detector
        run: make test-race

      - name: Test repeated in one process
        run: make test-repeat

  lsp:
    name: LSP integration (gopls)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27

      # The gated LSP tests spawn a real language server. The version is pinned
      # in the Makefile to match the flake's pkgs.gopls.
      - name: Install gopls
        run: |
          make install-gopls
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run LSP integration tests
        run: make test-lsp

  cross:
    name: Cross-compile + vet (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27

      # These targets are the ones the Makefile releases, and the linux job also
      # type-checks the linux-only files (openat2 sandbox check, process groups).
      - name: Build
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...

      - name: Vet
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

  browser:
    name: Browser smoke (real Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27

      # Provides a Chrome for Testing binary on PATH, which findBrowser picks up.
      # The smoke test drives both browser paths through the filtering proxy
      # against a loopback page and asserts the proxy was used.
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Browser smoke test
        run: make test-browser

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27

      # Blocking, and pinned: `latest` could red the build without a code
      # change. Bump the pin together with the Makefile's
      # STATICCHECK_VERSION when a newer release is wanted.
      - name: Run staticcheck
        run: make staticcheck
