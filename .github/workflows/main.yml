name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  ci:
    name: Build + Lint + Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Keep this version in sync with the toolchain used to format the
          # tree: `make fmt-check` compares against this Go's gofmt, and gofmt
          # output can differ between Go releases.
          go-version: 1.27

      - name: Build
        run: make build

      - name: Check formatting
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Test with race detector
        run: make test-race

      - name: Test repeated in one process
        run: make test-repeat

      # tuiprobe is a nested module: the root's ./... silently skips it, so it is
      # tested here explicitly. Formatting is already covered by make fmt-check.
      # The examples are tuiprobe's own scenarios, run through its own runner.
      - name: Test the tuiprobe module
        run: |
          make test-tuiprobe
          make test-tuiprobe-race
          make test-tuiprobe-examples

  lsp:
    name: LSP integration (gopls + typescript)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27

      # The gated LSP tests spawn a real language server. The version is pinned
      # in the Makefile to match the flake's pkgs.gopls.
      - name: Install gopls
        run: |
          make install-gopls
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The second server the gated tests exercise. A registry hiccup must not fail
      # the job — and must not add an annotation — so a failed install is reported
      # and the TypeScript case skips with that reason.
      - name: Install typescript-language-server (optional)
        run: |
          make install-tsls || echo "typescript-language-server not installed; its gated test will skip"
          command -v typescript-language-server || true

      - name: Run LSP integration tests
        run: make test-lsp
      # The same gopls this job already provides, now driving the TUI scenarios that prove
      # /diagnostics reaches a real server instead of reporting a config problem — once with the
      # server started by a file read, once by an LSP tool call.
      - name: TUI LSP scenarios
        run: make test-tui-lsp

  confine:
    name: Sandbox confinement (Landlock + PTY)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27

      # Which mechanisms this kernel actually offers, printed rather than assumed. A silent
      # skip on a host without Landlock looks exactly like a pass, and the difference decides
      # whether the scenario below is evidence or a no-op.
      - name: Report the confinement capability
        run: |
          uname -a
          echo "LSM list: $(cat /sys/kernel/security/lsm 2>/dev/null || echo '(not readable)')"

      # -v on purpose, for the same reason make test-lsp has it: whether the acceptance test
      # ran or skipped, with the reason, is the point. Without -v a skipped test prints
      # nothing, and the job reads as green evidence it does not have.
      - name: Landlock acceptance test, verbosely
        run: go test ./tool/ -run 'TestLandlock' -count=1 -v

      # The command-boundary scenarios drive the real binary on a PTY with confinement
      # switched on, and assert on the filesystem afterwards: a write under the workspace
      # must happen and one outside it must not. The target probes the launcher itself and
      # skips with the kernel's own reason where there is no mechanism.
      - name: TUI command-boundary scenarios
        run: make test-tui-confine

      # The scenario drives the app with --log-level=debug, so the app's own log lands under
      # the scenario HOME. On a failure that log is the only artifact that says which stage
      # stalled, and this job used to discard it — which is why the intermittent timeout in
      # issue #152 could be attributed only from the screen dump. Preserve it, with the
      # config the scenario wrote (it names the granted root), so the next sighting is
      # attributable rather than re-guessed.
      - name: Preserve the app debug log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: confine-debug-log
          path: |
            /tmp/tinyscen-home-confine/.tinycode/log
            /tmp/tinyscen-home-confine/.tinycode/config.json
          if-no-files-found: warn
          retention-days: 7

  cross:
    name: Cross-compile + vet (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27

      # These targets are the ones the Makefile releases, and the linux job also
      # type-checks the linux-only files (openat2 sandbox check, process groups).
      - name: Build
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...

      - name: Vet
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

      # The nested module is invisible to the root's ./... , including here: a
      # platform-gated break in tuiprobe must fail this job, not wait for a tag.
      - name: Build and vet the tuiprobe module
        run: |
          cd tuiprobe
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

  browser:
    name: Browser smoke (real Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27

      # Provides a Chrome for Testing binary on PATH, which findBrowser picks up.
      # The smoke test drives both browser paths through the filtering proxy
      # against a loopback page and asserts the proxy was used.
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Browser smoke test
        run: make test-browser
        env:
          # Explicit beats guessed: the runner image also ships a
          # /usr/bin/chromium-browser shim whose --version hangs and which cannot
          # start without a sandbox, and discovery probes and prefers this path.
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  tui-visual:
    name: TUI visual (screenshots + PTY)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27

      # Provides a Chrome for Testing binary on PATH, which tool.FindBrowser
      # picks up for the frame screenshots.
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      # The golden frames and the headless program driver run in the `ci` job
      # without any of this. This job is the only place the real binary is
      # started on a PTY and the frames are turned into images.
      - name: TUI visual checks
        run: make test-tui-visual

      # The scenario files are the black-box half (AGENTS.md, "Adding a TUI
      # scenario"): the same real binary, driven by the pinned tool's CLI.
      - name: TUI scenario files
        run: make test-tui-scenarios

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27

      # Blocking, and pinned: `latest` could red the build without a code
      # change. Bump the pin together with the Makefile's
      # STATICCHECK_VERSION when a newer release is wanted.
      - name: Run staticcheck
        run: |
          make staticcheck
          make lint-tuiprobe
