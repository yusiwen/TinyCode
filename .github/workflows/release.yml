name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Must satisfy the `go` directive in go.mod, which CI keeps in step
      # with the flake (see the ci job in main.yml).
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27

      - name: Cross-compile
        run: make releases

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/*
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
